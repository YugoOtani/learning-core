<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manabi — 今日の学び</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2935;
      --muted: #71808b;
      --line: #e7ece9;
      --paper: #fbfcfa;
      --green: #337d67;
      --green-dark: #245c4c;
      --mint: #e9f3ed;
      --peach: #f7eee4;
      --lavender: #eeedf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.6;
    }
    .shell { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
    header { height: 76px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.78); }
    .topbar { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 750; letter-spacing: -.04em; }
    .brand-mark { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: white; background: var(--green); font-size: 16px; }
    .nav { display: flex; align-items: center; gap: 28px; color: var(--muted); font-size: 13px; }
    .nav .active { color: var(--green-dark); font-weight: 700; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--green-dark); background: var(--mint); font-size: 13px; font-weight: 700; }
    main { padding: 58px 0 72px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(30px, 4vw, 42px); line-height: 1.25; letter-spacing: -.055em; }
    .intro { margin: 0; color: var(--muted); font-size: 15px; }
    .tools { margin-top: 42px; }
    .tools-head { margin-bottom: 17px; }
    h1 { margin-bottom: 0; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .tool-card { min-height: 168px; padding: 20px 21px; border: 1px solid var(--line); border-radius: 15px; background: white; display: flex; flex-direction: column; }
    .card-top { display: flex; align-items: center; gap: 12px; }
    .tool-icon { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: 13px; font-size: 20px; }
    .mint { background: var(--mint); } .peach { background: var(--peach); } .lavender { background: var(--lavender); } .blue { background: #eaf1f7; }
    .tool-card h3 { margin: 0; font-size: 15px; line-height: 1.45; }
    .tool-card p { margin: 12px 0 15px; color: var(--muted); font-size: 12px; }
    .tool-card p { margin-bottom: 0; }
    @media (max-width: 720px) {
      .shell { padding: 0 18px; } .nav { gap: 14px; } .nav .optional { display: none; }
      main { padding-top: 39px; } .grid { grid-template-columns: 1fr; } .tool-card { min-height: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell topbar">
      <div class="brand"><span class="brand-mark">学</span>manabi</div>
      <nav class="nav" aria-label="メインナビゲーション">
        <span class="active">ホーム</span><span class="optional">学習ツール</span><span class="optional">学習履歴</span><span class="avatar" aria-label="プロフィール">A</span>
      </nav>
    </div>
  </header>
  <main class="shell">
    <h1>今日の学び</h1>

    <section class="tools" aria-labelledby="tools-title">
      <div class="tools-head">
        <h2 id="tools-title">ツール一覧</h2>
      </div>
      <div class="grid">
        <article class="tool-card">
          <div class="card-top"><div class="tool-icon mint">⌘</div><h3>AtCoderの問題に挑戦</h3></div>
          <p>今日の一問。実際にコードを書いて、解き方を考えてみましょう。</p>
        </article>
        <article class="tool-card">
          <div class="card-top"><div class="tool-icon peach">✦</div><h3>AIに関する最新ニュース</h3></div>
          <p>今週の注目ニュースを読み、技術の動きをつかみましょう。</p>
        </article>
        <article class="tool-card">
          <div class="card-top"><div class="tool-icon lavender">◉</div><h3>データで見る世界の人口</h3></div>
          <p>インタラクティブな地図を動かしながら、人口の変化を見てみます。</p>
        </article>
        <article class="tool-card">
          <div class="card-top"><div class="tool-icon blue">↗</div><h3>「なぜ空は青い？」を考える</h3></div>
          <p>身近な疑問から出発して、光の性質をたどってみましょう。</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
